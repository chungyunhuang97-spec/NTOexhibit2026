<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI 去背測試機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg: #15130f;
    --surface: #211d17;
    --surface-2: #2b2620;
    --surface-3: #35302a;
    --text: #f0e9df;
    --text-muted: #9b9184;
    --accent: #4f8ff0;
    --accent-soft: rgba(79,143,240,0.16);
    --live: #5fd67a;
    --warn: #f0b34f;
    --border: #3a342b;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Noto Sans TC', 'Hiragino Sans', system-ui, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    display:flex;
  }

  .app{
    flex:1; min-width:0; min-height:0;
    display:flex; flex-direction:column; gap:10px;
    padding: 12px;
  }

  header.top{ flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  header.top h1{ font-size: 1rem; font-weight:700; margin:0; letter-spacing:.02em; }
  header.top .sub{ font-size:.68rem; color:var(--text-muted); margin-top:2px; }
  .status{
    font-family:var(--mono); font-size:.66rem; color:var(--text-muted);
    display:flex; align-items:center; gap:6px; white-space:nowrap; flex:0 0 auto;
  }
  .status .dot{ width:7px; height:7px; border-radius:50%; background:var(--border); }
  .status.live .dot{ background:var(--live); box-shadow:0 0 6px var(--live); }

  /* Row 1: 攝影 / 合成畫面 */
  .stage{
    position:relative; width:100%; flex:1; min-height:0;
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    overflow:hidden; display:flex; align-items:center; justify-content:center;
  }
  .stage canvas, .stage img.result{ width:100%; height:100%; object-fit:cover; display:block; }

  /* 展場裝置是 iPad 橫向掛載，攝影框固定用橫式比例呈現，
     手機直拿測試時也一樣（置中、上下留白），跟正式畫面保持一致，
     同時避免撐成又高又窄的框、把相機畫面裁得像被放大好幾倍 */
  @media (orientation: portrait){
    .app{ justify-content:center; }
    .stage{ flex:0 1 auto; aspect-ratio: 4/3; max-height:100%; }
  }

  .scene-pick{
    width:100%; height:100%; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:20px;
  }
  .scene-pick .label{ text-align:center; }
  .scene-grid{
    display:grid; grid-template-columns:repeat(3, minmax(72px, 110px)); gap:10px;
    justify-content:center;
  }
  .scene-grid .scene-btn{ width:100%; height:auto; aspect-ratio:1; }
  .scene-pick-hint{ margin:0; font-size:.68rem; color:var(--text-muted); text-align:center; max-width:34ch; }
  .scene-pick-hint.err{ color:var(--warn); }

  .stat-tag{
    position:absolute; top:10px; right:10px; background:rgba(21,19,15,0.72);
    backdrop-filter:blur(4px); border:1px solid var(--border); border-radius:100px;
    padding:5px 10px; font-size:.65rem; color:var(--live); font-family:var(--mono);
    pointer-events:none; text-align:right;
  }
  .mode-tag{
    position:absolute; top:10px; left:10px; background:rgba(21,19,15,0.72);
    backdrop-filter:blur(4px); border:1px solid var(--border); border-radius:100px;
    padding:5px 10px; font-size:.65rem; color:var(--text-muted); font-family:var(--mono);
    pointer-events:none;
  }

  .processing-veil{
    position:absolute; inset:0; background:rgba(21,19,15,0.9); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    color:var(--text-muted); font-size:.72rem; font-family:var(--mono); text-align:center; padding:24px;
  }
  .progress-wrap{ width:min(70%, 260px); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .progress-track{ width:100%; height:8px; border-radius:100px; background:var(--surface-3); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:var(--accent); border-radius:100px; transition:width .15s ease-out; }
  .progress-pct{ font-family:var(--mono); font-size:.85rem; color:var(--text); font-weight:700; }

  /* 浮在攝影畫面下緣的操作列（快門 / 重拍・確認） */
  .stage-controls{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px; z-index:5;
  }
  .shutter{
    width:60px; height:60px; border-radius:50%; flex:0 0 auto; border:3px solid #fff;
    background:transparent; cursor:pointer; position:relative;
  }
  .shutter::after{ content:''; position:absolute; inset:5px; border-radius:50%; background:#fff; }
  .shutter:active::after{ inset:8px; }

  .result-controls{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:rgba(21,19,15,0.72); backdrop-filter:blur(4px);
    border:1px solid var(--border); border-radius:16px; padding:10px 14px;
  }
  .result-stat{ font-family:var(--mono); font-size:.64rem; color:var(--live); text-align:center; }
  .result-stat.fallback{ color:var(--warn); }
  .result-btn-row{ display:flex; align-items:center; gap:10px; }
  .btn{
    border:none; border-radius:100px; padding:10px 18px; font-size:.78rem;
    font-weight:700; cursor:pointer; font-family:var(--sans); letter-spacing:.02em;
  }
  .btn.primary{ background:var(--accent); color:#0b1220; }
  .btn.primary:active{ filter:brightness(0.92); }
  .btn.ghost{ background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.4); color:#fff; }
  .back-to-idle-link{
    background:none; border:none; color:rgba(255,255,255,0.6); font-size:.66rem;
    font-family:var(--sans); text-decoration:underline; cursor:pointer; padding:2px;
  }

  /* Row 2: 場景選擇 */
  section.scenes{ flex:0 0 auto; display:none; flex-direction:column; gap:6px; }
  .label-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .label{ font-size:.64rem; color:var(--text-muted); letter-spacing:.06em; text-transform:uppercase; }
  .scene-strip{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .scene-strip::-webkit-scrollbar{ display:none; }
  .scene-btn{
    flex: 0 0 auto; width:64px; height:64px; border-radius:12px; padding:0;
    border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer;
    overflow:hidden; position:relative;
  }
  .scene-btn canvas{ width:100%; height:100%; display:block; }
  .scene-btn.active{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .scene-btn .num{
    position:absolute; bottom:2px; right:4px; font-family:var(--mono); font-size:.55rem;
    color:rgba(255,255,255,0.85); text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }

  .idle-start-btn{ width:auto; padding:11px 26px; }

  .facing-toggle{
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-muted); font-size:.64rem; font-family:var(--mono); padding:5px 10px;
    border-radius:100px; cursor:pointer;
  }

  @media (max-width: 560px){
    .app{ padding:10px; gap:8px; }
    .scene-btn{ width:54px; height:54px; }
  }

  /* 列印：印出來的不是螢幕上看到的合成照片本身，而是另外合成的
     「照片＋對應主題外框」版本（#printImg），使用者在前台看不到這個
     合成過程。畫面上的按鈕、場景列、標題都不印。
     紙張尺寸目前先用證卡/名牌常見的 CR80 尺寸（85.6×54mm）當佔位值，
     印表機/紙材確定後，改這裡的 size 就好，其他都不用動；由於列印內容
     多了外框、比例會比原本的照片更高，屆時也一併重新調整。 */
  @media print{
    @page{ size: 85.6mm 54mm; margin:0; }
    body *{ visibility:hidden; }
    #printImg{
      visibility:visible;
      position:fixed; inset:0; width:100%; height:100%; object-fit:cover; margin:0;
    }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div>
      <h1>AI 去背測試機</h1>
      <div class="sub">拍完再處理・瀏覽器端 AI 人像分割</div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="status" id="statusTag"><span class="dot"></span><span id="statusText">待機</span></div>
      <button class="facing-toggle" id="facingBtn" style="display:none;">切換鏡頭</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="scene-pick" id="scenePickView">
      <div class="label">選擇場景</div>
      <div class="scene-grid" id="sceneGrid"></div>
      <p class="scene-pick-hint" id="permHint">按下拍照後，iPad Safari 會跳出相機權限詢問，請允許使用</p>
      <button class="btn primary idle-start-btn" id="confirmSceneBtn">拍照</button>
    </div>

    <canvas id="displayCanvas" width="640" height="480" style="display:none;"></canvas>
    <img id="resultImg" class="result" style="display:none;" alt="合成結果" />
    <img id="printImg" style="display:none;" alt="" />
    <div class="mode-tag" id="modeTag" style="display:none;">預覽（原始畫面，未去背）</div>
    <div class="stat-tag" id="statTag" style="display:none;">未拍攝</div>

    <div class="stage-controls" id="liveActionBar" style="display:none;">
      <button class="shutter" id="shutterBtn" aria-label="拍照"></button>
    </div>

    <div class="stage-controls" id="resultActionBar" style="display:none;">
      <div class="result-controls">
        <div class="result-stat" id="resultStat">處理耗時：-- ms</div>
        <div class="result-btn-row">
          <button class="btn ghost" id="retakeBtn">重新拍攝</button>
          <button class="btn primary" id="printBtn">列印</button>
        </div>
        <button class="back-to-idle-link" id="backToIdleBtn">回到待機畫面</button>
      </div>
    </div>

    <div class="processing-veil" id="processingVeil">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
      <div id="veilText">AI 去背處理中…</div>
    </div>
  </div>

  <section class="scenes" id="sceneSection">
    <div class="label-row"><span class="label">場景選擇</span></div>
    <div class="scene-strip" id="sceneStrip"></div>
  </section>

</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
